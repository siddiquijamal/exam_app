<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .score-box {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 15px;
            background: #e8f9f1;
            border-left: 6px solid #43cea2;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #185a9d;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #e1f5fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Result</h1>

        <div class="score-box">
            Your Score: {{finalscore}}
        </div>

        <table>
            <tr>
                <th>Qno</th>
                <th>Question</th>
                <th>Correct Answer</th>
                <th>Your Answer</th>
            </tr>
            {% for answerdetails in responses %}
            <tr>
                <td>{{answerdetails.0}}</td>
                <td>{{answerdetails.1}}</td>
                <td>{{answerdetails.2}}</td>
                <td>{{answerdetails.3}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
