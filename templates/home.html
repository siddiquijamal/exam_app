<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam App - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 80px auto;
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .button-box {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .login {
            background: #3498db;
        }
        .register {
            background: #2ecc71;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Exam App</h1>
        <p>Take tests, track your progress, and improve your knowledge.</p>
        <div class="button-box">
            <a href="{% url 'login'%}" class="btn login">Login</a>
            <a href="{% url 'register'%}" class="btn register">Register</a>
        </div>
    </div>

</body>
</html>
